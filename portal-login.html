<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Carve Creation Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/portal.css?v=1">
<link rel="icon" type="image/png" href="assets/images/Favicon.png">
</head>
<body>
<div class="p-auth">
  <div class="p-auth-form-col">
    <div class="p-auth-logo"><a href="/"><img src="assets/images/Carve_Creation_logo_transparent.png" alt="Carve Creation" width="804" height="272" loading="lazy"></a></div>
    <div class="p-auth-body">
      <h1>Welcome Back</h1>
      <p class="p-sub">Log in to manage your projects.</p>
      <form>
        <div class="p-field">
          <label for="email">Email Address</label>
          <div class="p-input-wrap"><input type="email" id="email" placeholder="Your email"></div>
        </div>
        <div class="p-field">
          <label for="password">Password</label>
          <div class="p-input-wrap">
            <input type="password" id="password" placeholder="Password">
            <span class="p-eye" data-toggle-password="password"><svg class="p-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0112 5c6 0 10 6 10 6a17.6 17.6 0 01-3.4 4"/><path d="M6.6 6.6C4 8.3 2 12 2 12s4 6 10 6c1.4 0 2.7-.3 3.9-.9"/><path d="M9.5 9.8a3 3 0 004.2 4.2"/></svg></span>
          </div>
        </div>
        <div class="p-row-between">
          <label class="p-checkbox-line"><span class="p-checkbox" data-toggle></span> Remember Me</label>
          <a href="portal-forgot-password.html" class="p-link">Forgot Password?</a>
        </div>
        <a href="portal-overview.html" class="p-btn p-btn-primary">Log In</a>
      </form>
      <p class="p-auth-foot">Need access? Contact your Carve Creation project manager.</p>
    </div>
  </div>
  <div class="p-auth-photo-col" style="background-image:url('assets/images/hero-hotel.jpg');"></div>
</div>
<script src="assets/js/portal.js"></script>
</body>
</html>
