<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | Carve Creation Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/portal.css?v=1">
<link rel="icon" type="image/png" href="assets/images/Favicon.png">
</head>
<body>
<div class="p-auth">
  <div class="p-auth-form-col">
    <div class="p-auth-logo"><a href="index.html"><img src="assets/images/Carve_Creation_logo_transparent.png" alt="Carve Creation"></a></div>
    <div class="p-auth-body">
      <h1>Forgot Your Password?</h1>
      <p class="p-sub">Enter your email address to reset your password.</p>
      <form>
        <div class="p-field">
          <label for="email">Email Address</label>
          <div class="p-input-wrap"><input type="email" id="email" placeholder="Your registered email address"></div>
          <p class="p-hint">We&rsquo;ll send you a link to reset your password.</p>
        </div>
        <a href="portal-reset-password.html" class="p-btn p-btn-primary">Send</a>
      </form>
      <p class="p-auth-foot">Remember your password? <a href="portal-login.html" class="p-link">Login</a></p>
    </div>
  </div>
  <div class="p-auth-photo-col" style="background-image:url('assets/images/hero-hotel.jpg');"></div>
</div>
<script src="assets/js/portal.js"></script>
</body>
</html>
