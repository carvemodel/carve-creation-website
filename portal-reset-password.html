<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | Carve Creation Portal</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/portal.css?v=1">
<link rel="icon" type="image/png" href="assets/images/Favicon.png">
</head>
<body>
<div class="p-auth">
  <div class="p-auth-form-col">
    <div class="p-auth-logo"><a href="index.html"><img src="assets/images/Carve_Creation_logo_transparent.png" alt="Carve Creation"></a></div>
    <div class="p-auth-body">
      <h1>Reset Your Password</h1>
      <p class="p-sub">Enter your new password below.</p>
      <form>
        <div class="p-field">
          <label for="pw1">New Password</label>
          <div class="p-input-wrap"><input type="password" id="pw1" placeholder="New Password"><span class="p-eye" data-toggle-password="pw1"><svg class="p-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0112 5c6 0 10 6 10 6a17.6 17.6 0 01-3.4 4"/><path d="M6.6 6.6C4 8.3 2 12 2 12s4 6 10 6c1.4 0 2.7-.3 3.9-.9"/><path d="M9.5 9.8a3 3 0 004.2 4.2"/></svg></span></div>
          <p class="p-hint">Minimum 8 characters, including a number and a symbol.</p>
        </div>
        <div class="p-field">
          <label for="pw2">Confirm New Password</label>
          <div class="p-input-wrap"><input type="password" id="pw2" placeholder="Password"><span class="p-eye" data-toggle-password="pw2"><svg class="p-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 5.2A10.6 10.6 0 0112 5c6 0 10 6 10 6a17.6 17.6 0 01-3.4 4"/><path d="M6.6 6.6C4 8.3 2 12 2 12s4 6 10 6c1.4 0 2.7-.3 3.9-.9"/><path d="M9.5 9.8a3 3 0 004.2 4.2"/></svg></span></div>
        </div>
        <a href="portal-login.html" class="p-btn p-btn-primary">Reset Password</a>
      </form>
      <p class="p-auth-foot">Back to <a href="portal-login.html" class="p-link">Login</a></p>
    </div>
  </div>
  <div class="p-auth-photo-col" style="background-image:url('assets/images/hero-hotel.jpg');"></div>
</div>
<script src="assets/js/portal.js"></script>
</body>
</html>
